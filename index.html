<script>
const E=['BP','Semelles','Longrines','Poteaux','Poutres','Dalles','Chaînages','Escaliers','Voiles','Autre'];
const D=['HA6','HA8','HA10','HA12','HA14','HA16','HA20','HA25'];
const LV=(n,t)=>({n,s:0,l:0,h:3,ea:15,pl:'dalle',pt:'cc',pe:.05,pv:0,ep:t=='rdc'?0.1:0,ns:0,fen:0,por:0});
const PX=[
['go','first','Installation de chantier','Implantation de l\'ouvrage','Ens',150000,'m',1],['go','first','Installation de chantier','Nettoyage général du site','Ens',50000,'m',1],
['go','first','Terrassement et fondations','Fouilles en rigoles','m³',1500,'fouille',1],['go','first','Terrassement et fondations','Remblai provenant des fouilles','m³',2000,'remb_fo',1],
['go','first','Terrassement et fondations','Remblai d\'apport y compris compactage','m³',5500,'remb_ap',1],['go','first','Terrassement et fondations','Béton de propreté dosé à 150 kg/m³','m³',70000,'V:BP',1],
['go','first','Terrassement et fondations','Béton armé pour semelles','m³',100000,'V:Semelles',1],['go','first','Terrassement et fondations','Agglomérés pleins de {ef} cm pour fondations','m²',5500,'fond',1],
['go','all','Gros œuvre','Béton armé pour longrines','m³',100000,'V:Longrines',1],['go','all','Gros œuvre','Béton armé pour poteaux','m³',100000,'V:Poteaux',1],
['go','all','Gros œuvre','Béton armé pour chaînages','m³',100000,'V:Chaînages',1],['go','all','Gros œuvre','Béton armé pour poutres','m³',100000,'V:Poutres',1],
['go','all','Gros œuvre','Béton armé pour escaliers','m³',105000,'V:Escaliers',1],['go','all','Gros œuvre','Béton armé pour voiles','m³',100000,'V:Voiles',1],
['go','all','Gros œuvre','Dallage au sol','m³',100000,'dal',1],['go','all','Gros œuvre','Dalle pleine en béton armé','m³',100000,'vpleine',1],['go','all','Gros œuvre','Dalle nervurée en béton armé','m³',100000,'vnerv',1],['go','all','Gros œuvre','Plancher en corps creux (poutrelles, hourdis, table de compression)','m²',25000,'scc',1],
['go','all','Gros œuvre','Agglomérés creux de {ea} cm pour murs d\'élévation','m²',5000,'elev',1],['go','all','Gros œuvre','Enduits verticaux intérieurs et extérieurs','m²',3200,'enduit',1],
['go','all','Gros œuvre','Enduits sous dalle','m²',3000,'ensd',1],
['so','all','Toiture et étanchéité','Toiture en bac alu y compris charpente','m²',13000,'toit',1],['so','all','Toiture et étanchéité','Étanchéité multicouche sur terrasse','m²',8000,'etanch',1],
['so','first','Assainissement','Fosse septique','Ens',750000,'m',1],['so','first','Assainissement','Puisard','Ens',180000,'m',2],
['so','all','Lots techniques et menuiseries','Électricité (ensemble)','Ens',2500000,'un',1],['so','all','Lots techniques et menuiseries','Plomberie sanitaire (ensemble)','Ens',1800000,'un',1],
['so','all','Lots techniques et menuiseries','Climatisation (ensemble)','Ens',1500000,'un',1],['so','all','Lots techniques et menuiseries','Fenêtres','m²',65000,'fen',1],['so','all','Lots techniques et menuiseries','Portes','u',145000,'por',1],
['fi','all','Revêtements','Carrelage grès cérame au sol y compris plinthes','m²',13500,'plan',1],['fi','all','Revêtements','Faïence sur murs des sanitaires','m²',11000,'faience',1],
['fi','all','Faux plafond, enduits plâtre et peinture','Faux plafond en plâtre','m²',8000,'plan',1],['fi','all','Faux plafond, enduits plâtre et peinture','Enduit plâtre sur murs intérieurs','m²',2500,'elev',1],
['fi','all','Faux plafond, enduits plâtre et peinture','Peinture sur murs intérieurs','m²',2000,'elev',1],['fi','all','Faux plafond, enduits plâtre et peinture','Peinture sur façades','m²',2000,'elev',1]
].map(a=>({ph:a[0],on:a[1],c:a[2],d:a[3],u:a[4],pu:a[5],src:a[6],k:a[7],ql:{}}));
const PH={go:'GROS ŒUVRE',so:'SECOND ŒUVRE',fi:'FINITION'};
const SRC={m:'Saisie manuelle',fouille:'Volume de fouilles',remb_fo:'Remblai issu des fouilles',remb_ap:'Remblai d\'apport',fond:'Surface murs de fondation',elev:'Surface murs d\'élévation',enduit:'Surface enduits (2 faces)',agg:'Nombre d\'agglos',plan:'Surface de plancher',dal:'Volume dallage',dalle:'Surface plancher haut',vpleine:'Volume dalle pleine',vnerv:'Volume dalle nervurée',scc:'Surface plancher corps creux',un:'Forfait (1 par niveau)',ensd:'Enduit sous dalle',etanch:'Surface étanchéité',toit:'Surface toiture',faience:'Surface faïence',fen:'Surface fenêtres',por:'Nombre de portes'};
E.forEach(e=>SRC['V:'+e]='Volume '+e);
const defSt=l=>E.map(e=>({l,e,v:0,a:D.map(()=>0)}));
function def(){return{nom:'',lv:[LV('RDC','rdc')],st:defSt(0),fd:{h:1.2,ea:20,lin:0},px:JSON.parse(JSON.stringify(PX)),pm:{},iv:IV0(),
p:{gr:.8,sa:.4,bp:150,da:300,ba:350,eau:.5,pe:5,sm:.03,cm:.25,se:.015,ce:7.5,ag:12.5,imp:5,tva:18,cl:3,ebp:.05,pr:50,ct:1.15,ced:1.2,hch:.2,sf:22,rf:.12,mp:20}}}
const IV0=()=>[
['pil','Maître d\'ouvrage','Propriétaire : décisions, financement, réception',0],['pil','Maître d\'œuvre / Architecte','Conception, permis, direction et suivi des travaux',0],['pil','BET Structure','Calcul béton armé, plans de ferraillage, visa des ouvrages',0],
['pil','BET Fluides / Électricité','Plans électricité, plomberie, climatisation',0],['pil','Économiste de la construction','Métrés, DQE, suivi des situations de travaux',0],['pil','Bureau de contrôle','Contrôle technique de la solidité et de la sécurité',0],
['pil','Coordonnateur SPS','Sécurité et protection de la santé sur le chantier',0],['pil','Géomètre-topographe','Bornage, implantation, relevés',0],['pil','Laboratoire géotechnique / béton','Étude de sol, essais de béton et d\'acier',0],
['pil','Conducteur de travaux / Chef de chantier','Planning, approvisionnement, coordination des corps d\'état',0],
['go','Terrassier','Fouilles, remblais, compactage, évacuation des déblais',8],['go','Maçon','Fondations, agglos, enduits, chaînages, dallage',40],['go','Ferrailleur','Coupe, façonnage et pose des armatures',20],
['go','Coffreur / Boiseur','Coffrage et étaiement : semelles, poteaux, poutres, dalles',15],['go','Bétonnier / Centrale à béton','Fourniture et mise en œuvre du béton',12],['go','Manœuvres / Aides','Manutention, approvisionnement, nettoyage',5],
['so','Plombier','Alimentation, évacuations, appareils sanitaires',20],['so','Électricien','Courants forts et faibles, tableaux, appareillage',25],['so','Frigoriste / Climaticien','Climatisation, ventilation',20],
['so','Étanchéiste','Étanchéité des terrasses, relevés',10],['so','Menuisier aluminium / Vitrier','Fenêtres, baies vitrées, garde-corps',15],['so','Charpentier / Couvreur','Charpente et couverture (bac alu)',10],
['fi','Peintre','Enduit plâtre, peinture intérieure et façades',30],['fi','Carreleur','Carrelage, plinthes, faïence',40],['fi','Plaquiste / Staffeur','Faux plafonds',20],['fi','Nettoyage de fin de chantier','Nettoyage et remise du bâtiment',10]
].map(a=>({g:a[0],r:a[1],m:a[2],pc:a[3],nom:'',ct:'',cv:0,st:'À consulter'}));
let S=def(),T='proj',SV=0,LAST='';
try{const c=localStorage.getItem('dbat_cur'),x=c&&localStorage.getItem('dbat_p_'+c);if(x)S=JSON.parse(x);else{const o=localStorage.getItem('devisbat');if(o)S=JSON.parse(o)}}catch(e){}
const idx=()=>{try{return JSON.parse(localStorage.getItem('dbat_idx')||'[]')}catch(e){return[]}};
function ttcNow(){try{const t=totPh(),G=t.go+t.so+t.fi;return G*(1+S.p.imp/100)*(1+S.p.tva/100)}catch(e){return 0}}
function save(force){try{if(!S.id)S.id='p'+Date.now().toString(36);const str=JSON.stringify(S);if(str==LAST&&!force)return;LAST=str;SV=Date.now();
 localStorage.setItem('dbat_p_'+S.id,str);localStorage.setItem('dbat_cur',S.id);const e={id:S.id,nom:S.nom||'Projet sans nom',maj:SV,ttc:ttcNow(),nl:S.lv.length},I=idx(),k=I.findIndex(x=>x.id==S.id);k<0?I.push(e):I[k]=e;localStorage.setItem('dbat_idx',JSON.stringify(I))}catch(e){}}
function saveNow(){save(true);render()}
const N=(x,d=2)=>(+x||0).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const $=id=>document.getElementById(id);
// ---------- calculs
function calc(){const p=S.p,fd=S.fd,R={V:{},lv:[],lvS:[],ac:D.map(()=>0),plan:0,fd:{}},l0=S.lv[0]||LV('x','rdc');
 const lf=fd.lin||l0.l,wf=p.cl*fd.ea/100,fo=lf*wf*fd.h,rt=Math.max(0,l0.s*(fd.h-l0.ep)),rf=Math.min(fo*p.pr/100,rt);
 Object.assign(R.fd,{lf,wf,fouille:fo,rtot:rt,remb_fo:rf,remb_ap:rt-rf,fond:lf*fd.h,bp:lf*wf*p.ebp});
 S.lv.forEach((L,i)=>{const o={n:L.n,vol:0,kg:0,sab:0,gra:0,ac:D.map(()=>0)},sv={V:{}};
  const add=(v,dos)=>{o.vol+=v;o.kg+=v*dos;o.sab+=v*p.sa;o.gra+=v*p.gr};
  S.st.filter(r=>r.l==i).forEach(r=>{const v=+r.v||0;R.V[r.e]=(R.V[r.e]||0)+v;sv.V[r.e]=(sv.V[r.e]||0)+v;add(v,r.e=='BP'?p.bp:p.ba);r.a.forEach((k,j)=>{R.ac[j]+=+k||0;o.ac[j]+=+k||0})});
  const au=(e,v,dos)=>{if(!(sv.V[e]>0)&&v>0){sv.V[e]=v;add(v,dos)}};
  if(i==0)au('BP',R.fd.bp,p.bp);au('Chaînages',L.l*L.ea/100*p.hch,p.ba);
  const hasD=(L.pl=='dalle'||L.pl=='terrasse');if(hasD)au('Dalles',L.pv>0?+L.pv:L.s*L.pe,p.ba);const vd=sv.V.Dalles||0;
  const dv=(L.s*L.ep)||0;add(dv,p.da);
  const el=L.l*L.h,f2=i==0?R.fd.fond:0,en=2*el,dl=(L.pl=='dalle'||L.pl=='terrasse')?+L.s:0;
  Object.assign(sv,{un:1,vpleine:L.pt=='pleine'?vd:0,vnerv:L.pt=='nerv'?vd:0,scc:hasD&&L.pt=='cc'?+L.s:0,vpl:vd,dal:dv,elev:el,enduit:en,plan:+L.s||0,fond:f2,agg:(el+f2)*p.ag,dalle:dl,ensd:dl*p.ced,etanch:L.pl=='terrasse'?+L.s:0,toit:L.pl=='toiture'?L.s*p.ct:0,
   faience:L.ns*p.sf,fen:L.fen>0?+L.fen:L.s*p.rf,por:L.por>0?+L.por:Math.round(L.s/p.mp),fouille:i?0:fo,remb_fo:i?0:R.fd.remb_fo,remb_ap:i?0:R.fd.remb_ap});
  R.plan+=+L.s||0;R.lvS.push(sv);
  o.ag=sv.agg;o.sab+=(el+f2)*p.sm+en*p.se;o.kgm=(el+f2)*p.cm*50+en*p.ce;
  o.sacs=(o.kg+o.kgm)/50;o.eau=(o.kg+o.kgm)*p.eau/1000;R.lv.push(o)});
 return R}
const bs=(src,s)=>src.startsWith('V:')?(s.V[src.slice(2)]||0):(s[src]||0);
const ap=(x,i)=>x.on=='all'||(x.on=='first'&&i==0)||(x.on=='last'&&i==S.lv.length-1);
function qty(x,R,i){if(!ap(x,i))return 0;if(x.src=='m')return x.on=='all'?+(x.ql&&x.ql[i])||0:+x.k||0;return bs(x.src,R.lvS[i])*(+x.k||0)}
const qtot=(x,R)=>S.lv.reduce((a,L,i)=>a+qty(x,R,i),0);
// ---------- onglets
const TABS={proj:'📁 Projets',arch:'1. Architecture',str:'2. Structure',px:'3. Prix',dqe:'4. Devis (DQE)',mat:'5. Quantités et achat matériaux',iv:'6. Intervenants'};
function render(){$('nom').value=S.nom;$('nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k==T?'on':''}" onclick="T='${k}';render()">${v}</button>`).join('');
 $('m').innerHTML=({proj,arch,str,px,dqe,mat,iv})[T]();save();$('sv').textContent=SV?'✔ Enregistré à '+new Date(SV).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}
const set=(o,k,v,num=1)=>{o[k]=num?(parseFloat(String(v).replace(',','.'))||0):v;render()};
const inp=(o,k,ref,num=1,cls='num')=>`<input class="${cls}" value="${o[k]}" onchange="set(${ref},'${k}',this.value,${num})">`;
const selc=(o,k,ref,opts,num=1)=>`<select onchange="set(${ref},'${k}',this.value,${num})">${opts.map(([v,t])=>`<option value="${v}" ${v==o[k]?'selected':''}>${t}</option>`).join('')}</select>`;
const EA=[10,12,15,20].map(v=>[v,v+' cm']),PL=[['dalle','Plancher haut simple'],['terrasse','Terrasse étanchée'],['toiture','Sous toiture légère'],['aucun','Aucun']],PT=[['cc','Corps creux'],['pleine','Dalle pleine'],['nerv','Dalle nervurée']];
function setPt(i,v){const L=S.lv[i];L.pt=v;L.pe={cc:.05,pleine:.15,nerv:.10}[v];render()}
function arch(){const R=calc(),f=S.fd,F=R.fd;
 return`<h2>1. Import des plans (PDF)</h2>${impPanel('arch')}
<h2>2. Données à renseigner – niveaux</h2><p class="hint">Saisissez seulement les cellules blanches. Le volume du plancher = surface × épaisseur (corps creux : table de compression ; dalle pleine ; dalle nervurée : épaisseur équivalente). Renseignez « Volume plancher » pour le corriger.</p>
<table><tr><th>Niveau</th><th>Surface bâtie (m²)</th><th>Linéaire murs (m)</th><th>Hauteur murs (m)</th><th>Ép. agglos</th><th>Type de plancher</th><th>Ép. plancher (m)</th><th>Volume plancher (m³) <small>0 = auto</small></th><th>Plancher haut</th><th>Ép. dallage (m)</th><th>Pièces d'eau</th><th>Fenêtres m² <small>(0=auto)</small></th><th>Portes <small>(0=auto)</small></th><th></th></tr>
${S.lv.map((L,i)=>`<tr><td>${inp(L,'n',`S.lv[${i}]`,0,'')}</td>${['s','l','h'].map(k=>`<td>${inp(L,k,`S.lv[${i}]`)}</td>`).join('')}<td>${selc(L,'ea',`S.lv[${i}]`,EA)}</td>
<td><select onchange="setPt(${i},this.value)">${PT.map(([v,t])=>`<option value="${v}" ${v==L.pt?'selected':''}>${t}</option>`).join('')}</select></td><td>${inp(L,'pe',`S.lv[${i}]`)}</td><td>${inp(L,'pv',`S.lv[${i}]`)}</td><td>${selc(L,'pl',`S.lv[${i}]`,PL,0)}</td>${['ep','ns','fen','por'].map(k=>`<td>${inp(L,k,`S.lv[${i}]`)}</td>`).join('')}<td><button class="x" onclick="delLv(${i})">✕</button></td></tr>`).join('')}</table>
<button class="b" onclick="addLv()">+ Ajouter un niveau</button>
<div class="card"><h2>Fondation</h2><div class="g"><div><label>Hauteur de fondation (m)</label>${inp(f,'h','S.fd')}</div><div><label>Épaisseur agglos de fondation</label>${selc(f,'ea','S.fd',EA)}</div><div><label>Linéaire de fondation (m) – 0 = linéaire murs du niveau bas</label>${inp(f,'lin','S.fd')}</div></div></div>
<h2>3. Résultats automatiques</h2><table><tr><th>Niveau</th><th>Surf. murs (m²)</th><th>Agglos (u)</th><th>Surf. enduits 2 faces</th><th>Surf. peinture int. + façade</th><th>Vol. dallage (m³)</th><th>Vol. plancher (m³)</th><th>Toiture (m²)</th><th>Fenêtres (m²)</th><th>Portes (u)</th></tr>
${R.lvS.map((v,i)=>`<tr><td>${S.lv[i].n}</td>${[v.elev,v.agg,v.enduit,v.elev*2,v.dal,v.vpl,v.toit,v.fen,v.por].map((x,k)=>`<td class="n">${N(x,k==1||k==8?0:2)}</td>`).join('')}</tr>`).join('')}</table>
<table><tr><th>Fondation et terrassement</th><th>Largeur fouille (m)</th><th>Volume fouilles (m³)</th><th>Remblai total (m³)</th><th>Dont issu des fouilles</th><th>Remblai d'apport</th><th>Surf. murs fondation</th><th>Agglos fondation (u)</th><th>Béton de propreté auto (m³)</th></tr>
<tr><td>Largeur = ${S.p.cl} × épaisseur agglos ; profondeur = hauteur de fondation</td>${[F.wf,F.fouille,F.rtot,F.remb_fo,F.remb_ap,F.fond,F.fond*S.p.ag,F.bp].map((x,k)=>`<td class="n">${N(x,k==6?0:2)}</td>`).join('')}</tr></table>
<div class="card"><h2>Coefficients (modifiables)</h2><div class="g">${[['cl','Largeur fouille = coef × ép. agglos'],['pr','Part des fouilles réutilisée en remblai (%)'],['ebp','Épaisseur béton de propreté (m)'],['hch','Hauteur des chaînages (m)'],['ct','Coef. toiture (pente + débords)'],['ced','Coef. enduit sous dalle'],['sf','Faïence par pièce d\'eau (m²)'],['rf','Fenêtres auto : m² par m² de plancher'],['mp','Portes auto : m² de plancher par porte'],['ag','Agglos par m² de mur'],['sm','Sable mortier pose (m³/m²)'],['cm','Ciment mortier pose (sac/m²)'],['se','Sable enduit (m³/m²)'],['ce','Ciment enduit (kg/m²)']].map(([k,l])=>`<div><label>${l}</label>${inp(S.p,k,'S.p')}</div>`).join('')}</div></div>`}
function addLv(){const i=S.lv.length;S.lv.push(LV(i?'R+'+i:'RDC'));S.st.push(...defSt(i));render()}

const nb=x=>parseFloat(String(x).replace(',','.'));
function loadPdf(){if(window.pdfjsLib)return Promise.resolve();
 const ld=c=>new Promise((ok,ko)=>{const e=document.createElement('script');e.src=c+'pdf.min.js';e.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=c+'pdf.worker.min.js';ok()};e.onerror=()=>{e.remove();ko()};document.head.appendChild(e)});
 return ld('vendor/pdfjs/').catch(()=>ld('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/')).catch(()=>{throw new Error('Lecteur PDF indisponible : une connexion internet est nécessaire pour cet import.')})}
async function pdfLines(f){await loadPdf();const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
 for(let n=1;n<=d.numPages;n++){const t=await(await d.getPage(n)).getTextContent(),m={};t.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(m[y]=m[y]||[]).push([it.transform[4],it.str])});
  Object.keys(m).sort((a,b)=>b-a).forEach(y=>out.push(m[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' ').replace(/\s+/g,' ').trim()))}
 return out.filter(Boolean)}
async function doImp(kind,el){const f=el.files[0];if(!f)return;const li=+document.getElementById('impLv').value;IMP={kind,li,busy:true,name:f.name};render();
 try{const L=await pdfLines(f);IMP={kind,li,name:f.name,n:L.length,...(kind=='str'?anaStr(L):anaPlan(L,kind))}}catch(e){IMP={kind,li,name:f.name,err:e.message}}render()}
function anaPlan(L,kind){const t=L.join('\n'),r={surf:[],tot:null,lin:[],h:[]};
 [...t.matchAll(/(\d+[.,]?\d*)\s*m\s*[²2]/gi)].forEach(m=>{const v=nb(m[1]);if(v>0&&v<5000)r.surf.push(v)});
 L.forEach(l=>{const m=l.match(/(surface\s*(b[âa]tie|totale|construite|de plancher|emprise)|emprise)[^\d]{0,25}(\d+[.,]?\d*)/i);if(m&&!r.tot)r.tot=nb(m[3])});
 [...t.matchAll(/(\d+[.,]?\d*)\s*(ml|m\.l)\b/gi)].forEach(m=>r.lin.push(nb(m[1])));
 [...t.matchAll(/(?:h(?:auteur|t|sp)?\.?\s*(?:sous\s*plafond)?)\s*[=:]\s*(\d[.,]\d{1,2})/gi)].forEach(m=>{const v=nb(m[1]);if(v>=2&&v<=6)r.h.push(v)});
 const cotes=[...new Set([...t.matchAll(/(?:^|\s)\+\s?(\d{1,2}[.,]\d{2})/g)].map(m=>nb(m[1])))].sort((a,b)=>a-b);r.cotes=cotes;
 if(cotes.length>1){r.dh=[];for(let i=1;i<cotes.length;i++){const d=+(cotes[i]-cotes[i-1]).toFixed(2);if(d>=2&&d<=6)r.dh.push(d)}}
 return r}
const KW={BP:/propret/i,Semelles:/semelle/i,Longrines:/longrine/i,Poteaux:/poteau/i,Poutres:/poutre/i,Chaînages:/cha[iî]nage/i,Escaliers:/escalier/i,Voiles:/voile/i,Dalles:/dalle|plancher/i};
function anaStr(L){const rows={};let cur=null;
 L.forEach(l=>{for(const e in KW)if(KW[e].test(l)){cur=e;rows[e]=rows[e]||{e,v:0,a:D.map(()=>0)};const m=l.match(/(\d+[.,]?\d*)\s*m\s*[3³]/i);if(m&&!rows[e].v)rows[e].v=nb(m[1]);break}
  if(cur)[...l.matchAll(/HA\s?(\d{1,2})\D{0,14}?(\d+[.,]?\d*)\s*kg/gi)].forEach(m=>{const k=D.indexOf('HA'+m[1]);if(k>=0&&!rows[cur].a[k])rows[cur].a[k]=nb(m[2])})});
 return{rows:Object.values(rows).filter(r=>r.v||r.a.some(x=>x))}}
function impPanel(kind){const lv=`<select id="impLv" style="width:auto">${S.lv.map((L,i)=>`<option value="${i}" ${IMP&&IMP.li==i?'selected':''}>${L.n}</option>`).join('')}</select>`;
 let h=`<div class="card np"><p class="hint">Le logiciel lit le <b>texte</b> des PDF (surfaces annotées, cotes de niveaux, notes de calcul) et vous propose les valeurs à appliquer ; rien n'est modifié sans votre clic. Les plans scannés (images) ne contiennent pas de texte et ne peuvent pas être lus. Connexion internet requise pour l'import.</p>
 Niveau : ${lv} ${kind=='arch'?`<button class="b" style="background:#1a7f37" onclick="openMes()">📏 Mesurer sur un plan</button><button class="b" onclick="document.getElementById('f1').click()">📄 Plan d'étage (PDF)</button><input type="file" id="f1" accept=".pdf" style="display:none" onchange="doImp('plan',this)"><button class="b" onclick="document.getElementById('f2').click()">📐 Coupe (PDF)</button><input type="file" id="f2" accept=".pdf" style="display:none" onchange="doImp('coupe',this)">`
 :`<button class="b" onclick="document.getElementById('f3').click()">📄 Dossier structure (PDF)</button><input type="file" id="f3" accept=".pdf" style="display:none" onchange="doImp('str',this)">`}`;
 const ok=IMP&&(kind=='arch'?IMP.kind!='str':IMP.kind=='str');
 if(ok){if(IMP.busy)h+='<p>Lecture du PDF…</p>';else if(IMP.err)h+=`<p style="color:#b33">${IMP.err}</p>`;else{const c=(v,f)=>`<button class="b" onclick="${f}(${v})">${N(v)}</button>`;h+=`<hr><b>${IMP.name}</b> – ${IMP.n} lignes de texte lues.`;
  if(IMP.kind=='str'){h+=IMP.rows.length?`<table><tr><th>Élément</th><th>Volume (m³)</th>${D.map(d=>`<th>${d} kg</th>`).join('')}</tr>${IMP.rows.map(r=>`<tr><td>${r.e}</td><td class="n">${N(r.v)}</td>${r.a.map(x=>`<td class="n">${x?N(x,1):''}</td>`).join('')}</tr>`).join('')}</table><button class="b" onclick="apStr()">✔ Appliquer au niveau ${S.lv[IMP.li].n}</button>`:'<p>Aucun élément de structure reconnu (mots-clés : poteau, poutre, semelle, longrine, chaînage, dalle… avec « m3 » ou « HA10 … kg »).</p>'}
  else if(IMP.kind=='plan'){h+=`<p>Surface bâtie annoncée : ${IMP.tot?c(IMP.tot,'apS'):'non trouvée'} · Somme des surfaces de pièces : ${IMP.surf.length?c(+IMP.surf.reduce((a,b)=>a+b,0).toFixed(2),'apS'):'aucune'}</p><p>Linéaires détectés (ml) : ${IMP.lin.length?IMP.lin.map(v=>c(v,'apL')).join(''):'aucun'}</p><p>Hauteurs détectées : ${IMP.h.length?[...new Set(IMP.h)].map(v=>c(v,'apH')).join(''):'aucune'}</p><p class="hint">Cliquez sur une valeur pour l'appliquer au niveau ${S.lv[IMP.li].n}. Le linéaire de murs se déduit rarement du texte : saisissez-le si absent.</p>`}
  else h+=`<p>Cotes de niveaux : ${IMP.cotes.length?IMP.cotes.map(N).join(' · '):'aucune'}</p><p>Hauteurs d'étages déduites : ${IMP.dh&&IMP.dh.length?IMP.dh.map(N).join(' · ')+' <button class="b" onclick="apDh()">✔ Appliquer aux niveaux dans l\'ordre</button>':'non déterminées'}</p>`}}
 return h+'</div>'}
const apS=v=>{S.lv[IMP.li].s=v;render()},apL=v=>{S.lv[IMP.li].l=v;render()},apH=v=>{S.lv[IMP.li].h=v;render()};
function apDh(){IMP.dh.forEach((v,i)=>{if(S.lv[i])S.lv[i].h=v});render()}
function apStr(){IMP.rows.forEach(x=>{let r=S.st.find(q=>q.l==IMP.li&&q.e==x.e);if(!r){r={l:IMP.li,e:x.e,v:0,a:D.map(()=>0)};S.st.push(r)}if(x.v)r.v=x.v;x.a.forEach((k,j)=>{if(k)r.a[j]=k})});render()}
// ---------- outil de mesure sur plan (PDF ou image)
let M=null;
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const area=P=>Math.abs(P.reduce((t,p,i)=>{const q=P[(i+1)%P.length];return t+p[0]*q[1]-q[0]*p[1]},0))/2;
const plen=P=>P.reduce((t,p,i)=>i?t+dist(P[i-1],p):0,0);
function openMes(){if(document.getElementById('mes'))return;const li=document.getElementById('impLv')?document.getElementById('impLv').value:0,o=document.createElement('div');o.id='mes';o.tabIndex=0;
 o.innerHTML=`<div class="mt"><b>📏 Mesure sur plan</b><button class="b" onclick="document.getElementById('mf').click()">Ouvrir plan (PDF / image)</button><input type="file" id="mf" accept=".pdf,image/*" style="display:none" onchange="mesFile(this)">
 <select id="mp" style="display:none" onchange="mesPage(+this.value)"></select>
 <button class="b" id="m_cal" onclick="mesMode('cal')">1. Échelle</button><button class="b" id="m_l" onclick="mesMode('l')">2. Linéaire (murs)</button><button class="b" id="m_s" onclick="mesMode('s')">3. Surface</button><button class="b" id="m_h" onclick="mesMode('h')">4. Hauteur (coupe)</button>
 <button class="b" onclick="mesEnd()">Terminer la forme (Entrée)</button><button class="b" onclick="mesUndo()">↶ Annuler</button><button class="b" onclick="mesZoom(1.25)">＋</button><button class="b" onclick="mesZoom(.8)">－</button>
 Niveau : <select id="ml">${S.lv.map((L,i)=>`<option value="${i}" ${i==li?'selected':''}>${L.n}</option>`).join('')}</select>
 <button class="b" style="background:#1a7f37" onclick="mesApply('s')">✔ → Surface bâtie</button><button class="b" style="background:#1a7f37" onclick="mesApply('l')">✔ → Linéaire murs</button><button class="b" style="background:#1a7f37" onclick="mesApply('h')">✔ → Hauteur</button>
 <button class="b" style="background:#e67e00;font-weight:bold" onclick="mesSave()">💾 ENREGISTRER dans le projet</button><button class="b r" onclick="document.getElementById('mes').remove();M=null">Fermer</button></div>
 <div class="ms" id="ms"></div><div class="cw" id="mcw"><canvas id="mc"></canvas></div>`;
 document.body.appendChild(o);M={z:.5,mode:'cal',cur:[],sh:[],k:0,W:0,H:0};const cv=document.getElementById('mc');
 cv.addEventListener('click',mesClick);cv.addEventListener('dblclick',()=>{M.cur.pop();mesEnd()});
 o.addEventListener('keydown',e=>{if(e.key=='Enter')mesEnd();if(e.key=='Escape'){M.cur=[];redraw()}if(e.ctrlKey&&e.key=='z')mesUndo()});o.focus();mesMode('cal')}
function mesMode(m){if(!M)return;M.mode=m;M.cur=[];['cal','l','s','h'].forEach(k=>{const b=document.getElementById('m_'+k);if(b)b.classList.toggle('on',k==m)});
 mesMsg(({cal:'Cliquez 2 points d\'une longueur connue (une cote, un mur côté), puis saisissez sa longueur réelle en mètres.',l:'Cliquez le long des murs ; Maj = trait horizontal/vertical ; double-clic ou Entrée = terminer un tracé.',s:'Cliquez les sommets du contour du bâtiment ; double-clic ou Entrée = fermer la surface.',h:'Sur la coupe (échelle faite sur la coupe) : cliquez 2 points en bas et en haut de la hauteur à lire.'})[m]);redraw()}
function mesMsg(t){const T=mesTot();document.getElementById('ms').innerHTML=(M.k?`Échelle : ${M.k.toFixed(5)} m/px`:'<b style="color:#b33">Échelle non définie</b>')+` — Linéaire : <b>${N(T.l)} m</b> · Surface : <b>${N(T.s)} m²</b> · Dernière hauteur : <b>${N(T.h)} m</b><br>${t||''}`}
function mesTot(){const k=M.k||0,T={l:0,s:0,h:0};M.sh.forEach(x=>{if(x.t=='l')T.l+=plen(x.p)*k;else if(x.t=='s')T.s+=area(x.p)*k*k;else if(x.t=='h')T.h=plen(x.p)*k});return T}
async function mesFile(el){const f=el.files[0];if(!f)return;M.sh=[];M.k=0;
 try{if(/pdf$/i.test(f.name)){await loadPdf();M.doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;const sp=document.getElementById('mp');sp.innerHTML=Array.from({length:M.doc.numPages},(_,i)=>`<option value="${i+1}">Page ${i+1}</option>`).join('');sp.style.display=M.doc.numPages>1?'':'none';await mesPage(1)}
 else{const im=new Image();im.onload=()=>mesBg(im,im.width,im.height);im.src=URL.createObjectURL(f)}}catch(e){alert(e.message)}}
async function mesPage(n){const pg=await M.doc.getPage(n),vp=pg.getViewport({scale:2}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;M.sh=[];M.k=0;mesBg(c,c.width,c.height)}
function mesBg(src,W,H){M.bg=src;M.W=W;M.H=H;const cv=document.getElementById('mc');cv.width=W;cv.height=H;M.z=Math.min(1,(document.getElementById('mcw').clientWidth-20)/W);mesMode('cal')}
function mesZoom(f){M.z*=f;redraw()}
function mesClick(e){if(!M.bg)return;const cv=e.target,r=cv.getBoundingClientRect();let p=[(e.clientX-r.left)/M.z,(e.clientY-r.top)/M.z];const q=M.cur[M.cur.length-1];
 if(e.shiftKey&&q){Math.abs(p[0]-q[0])>Math.abs(p[1]-q[1])?p[1]=q[1]:p[0]=q[0]}M.cur.push(p);
 if(M.mode=='cal'&&M.cur.length==2){const d=dist(M.cur[0],M.cur[1]);redraw();ask('Longueur réelle de ce segment (en mètres) ?').then(r=>{const v=parseFloat((r||'').replace(',','.'));M.cur=[];if(v>0){M.k=v/d;mesMode('l')}else{redraw();mesMsg()}});return}
 if(M.mode=='h'&&M.cur.length==2){M.sh.push({t:'h',p:M.cur});M.cur=[]}redraw();mesMsg()}
function mesEnd(){if(!M||!M.bg)return;const n=M.cur.length;if((M.mode=='l'&&n>=2)||(M.mode=='s'&&n>=3)){M.sh.push({t:M.mode,p:M.cur});M.cur=[]}redraw();mesMsg()}
function mesUndo(){if(M.cur.length)M.cur.pop();else M.sh.pop();redraw();mesMsg()}
function redraw(){if(!M||!M.bg)return;const cv=document.getElementById('mc'),c=cv.getContext('2d');cv.style.width=M.W*M.z+'px';c.drawImage(M.bg,0,0);const lw=2.5/M.z,col={l:'#d00',s:'#0a7',h:'#00c'};
 const dr=(P,st,cl,close)=>{if(!P.length)return;c.strokeStyle=cl;c.fillStyle=cl;c.lineWidth=lw;c.beginPath();P.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));if(close&&P.length>2)c.closePath();c.stroke();if(close&&P.length>2){c.globalAlpha=.18;c.fill();c.globalAlpha=1}P.forEach(q=>{c.beginPath();c.arc(q[0],q[1],3.5/M.z,0,7);c.fill()})};
 M.sh.forEach(x=>dr(x.p,0,col[x.t],x.t=='s'));dr(M.cur,0,M.mode=='cal'?'#f80':(col[M.mode]||'#f80'),M.mode=='s')}
function mesApply(k){const T=mesTot(),i=+document.getElementById('ml').value,L=S.lv[i];if(!M.k){alert('Définissez d\'abord l\'échelle.');return}
 const v={s:T.s,l:T.l,h:T.h}[k];if(!(v>0)){alert('Aucune mesure de ce type.');return}L[k]=+v.toFixed(2);save(true);render();mesMsg(`✔ ${k=='s'?'Surface bâtie':k=='l'?'Linéaire de murs':'Hauteur'} de ${L.n} = ${N(v)} appliquée. Fermez la fenêtre pour voir le résultat dans l'onglet Architecture.`)}
function mesSave(){if(!M.k){alert('Définissez d\'abord l\'échelle.');return}const T2=mesTot(),L=S.lv[+document.getElementById('ml').value],d=[];
 [['s','Surface bâtie',T2.s,'m²'],['l','Linéaire de murs',T2.l,'m'],['h','Hauteur',T2.h,'m']].forEach(([k,n,v,u])=>{if(v>0){L[k]=+v.toFixed(2);d.push(n+' '+N(v)+' '+u)}});
 if(!d.length){alert('Aucune mesure à enregistrer.');return}save(true);render();mesMsg('✔ Enregistré dans le projet « '+(S.nom||'sans nom')+' », niveau '+L.n+' : '+d.join(' · '))}
// ---------- fichiers
function dl(name,txt,type='text/csv'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type}));a.download=name;a.click()}
function saveF(){dl((S.nom||'projet')+'.json',JSON.stringify(S),'application/json')}
function loadF(el){const f=el.files[0];if(f)f.text().then(t=>{try{const x=JSON.parse(t.replace(/^\ufeff/,''));save();
 if(x&&Array.isArray(x.projets)){const over=confirm('Sauvegarde de '+x.projets.length+' projet(s).\nOK = remplacer les projets existants de même identifiant.\nAnnuler = les ajouter comme nouveaux projets.');let n=0;
  x.projets.forEach(q=>{if(!q||!q.lv)return;if(!q.id||(!over&&idx().some(i=>i.id==q.id)))q.id='p'+Date.now().toString(36)+(n++);else n++;S=q;mig();LAST='';save(true)});
  T='proj';render();alert(n+' projet(s) restauré(s).');return}
 S=x;S.id=undefined;mig();LAST='';save(true);T='arch';render()}catch(e){alert('Fichier invalide')}});el.value=''}
function backupAll(){save();const P=idx().map(i=>{try{return JSON.parse(localStorage.getItem('dbat_p_'+i.id))}catch(e){return null}}).filter(Boolean);
 if(!P.length){alert('Aucun projet à sauvegarder.');return}const d=new Date().toISOString().slice(0,10);
 dl('DevisBat_sauvegarde_'+d+'.json',JSON.stringify({app:'DevisBat',v:1,date:new Date().toISOString(),projets:P}),'application/json');
 try{localStorage.setItem('dbat_bk',Date.now())}catch(e){}render()}
function bkBanner(I){if(!I.length)return'';const b=+localStorage.getItem('dbat_bk')||0,j=b?Math.floor((Date.now()-b)/864e5):null;
 return j!==null&&j<7?`<p class="hint" style="color:#1a7f37">✔ Dernière sauvegarde complète : ${j==0?'aujourd\'hui':'il y a '+j+' jour(s)'}.</p>`:`<div class="card" style="background:#FFF2CC">⚠ ${b?'Dernière sauvegarde complète il y a '+j+' jours.':'Aucune sauvegarde complète effectuée.'} Cliquez sur « Sauvegarde complète » pour télécharger tous vos projets dans un seul fichier.</div>`}
mig();render();
</script></body></html>
